<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ujian SMP NEGERI 2 PURWO</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:15px}
button{background:#1a73e8;color:#fff;border:none;font-weight:700;cursor:pointer}
button:disabled{background:#999}
.opt{border:1px solid #ddd;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.opt.active{border-color:#1a73e8;background:#e8f0fe}
.opt img{max-width:100%;border-radius:8px;margin-top:6px}
.q-img{max-width:100%;border-radius:10px;margin:10px 0}
.badge{display:inline-block;background:#e8f0fe;color:#1a73e8;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.small{font-size:13px;color:#666}
.checkrow{display:flex;gap:8px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:10px;margin:6px 0}
.checkrow.active{border-color:#1a73e8;background:#e8f0fe}
</style></head>
<body>
<div id="app"></div>
<script>
const API_URL = "GANTI_DENGAN_URL_APPS_SCRIPT_KAMU"; // <-- GANTI INI SAJA, sisanya sama
let siswa={}, soalDB=[], jadwalDB=[], jawaban={}, mapelAktif="", kelasAktif="";

// === 1. RENDER GAMBAR DARI DRIVE ===
function renderTeks(t){
  if(!t) return "";
  // Format: [GAMBAR:ID_DRIVE] atau [GAMBAR:https://...]
  t = t.replace(/\[GAMBAR:\s*([^\]]+)\]/g, (m, id)=>{
    id=id.trim();
    let src = id.startsWith("http") ? id : "https://drive.google.com/uc?export=view&id="+id;
    return '<br><img class="q-img" src="'+src+'" onerror="this.style.display=\'none\'">';
  });
  return t;
}

// === 2. LOGIN ===
function showLogin(){
  document.getElementById("app").innerHTML = `
  <div class="card"><h2>Ujian SMP NEGERI 2 PURWO</h2>
  <p class="small">Login Siswa</p>
  <input id="nama" placeholder="Nama Lengkap">
  <select id="kelas"><option value="">Pilih Kelas</option><option>7A</option><option>7B</option><option>8A</option><option>8B</option><option>9A</option><option>9B</option></select>
  <button onclick="masuk()">MASUK</button></div>`;
}
function masuk(){
  let n=document.getElementById("nama").value.trim();
  let k=document.getElementById("kelas").value;
  if(!n||!k) return alert("Isi nama dan kelas!");
  siswa={nama:n,kelas:k}; kelasAktif=k;
  loadData();
}
async function loadData(){
  document.getElementById("app").innerHTML="<div class='card'>Memuat soal...</div>";
  try{
    let r=await fetch(API_URL+"?action=getData"); let d=await r.json();
    soalDB=d.soal||[]; jadwalDB=d.jadwal||[];
    showJadwal();
  }catch(e){ document.getElementById("app").innerHTML="<div class='card'>Gagal load. Cek internet / URL Apps Script. <button onclick='showLogin()'>Coba Lagi</button></div>"; }
}

// === 3. JADWAL - FILTER KELAS 7/8/9 + SEMUA ===
function kelasCocok(kelasSoal){
  if(kelasSoal=="SEMUA") return true;
  if(kelasSoal==kelasAktif) return true;
  if(kelasSoal=="KELAS 7" && (kelasAktif=="7A"||kelasAktif=="7B")) return true;
  if(kelasSoal=="KELAS 8" && (kelasAktif=="8A"||kelasAktif=="8B")) return true;
  if(kelasSoal=="KELAS 9" && (kelasAktif=="9A"||kelasAktif=="9B")) return true;
  return false;
}
function showJadwal(){
  let j = jadwalDB.filter(x=>kelasCocok(x.kelas));
  let h=`<div class="card"><b>Halo, ${siswa.nama} - ${siswa.kelas}</b><p class="small">Pilih jadwal ujian</p></div>`;
  if(j.length==0) h+=`<div class="card">Belum ada jadwal untuk kelas kamu.</div>`;
  j.forEach((x,i)=>{
    h+=`<div class="card"><span class="badge">${x.kelas}</span><br><b>${x.mapel}</b><br><span class="small">${x.tanggal} | ${x.jam} | ${x.durasi} menit | ${x.keterangan||""}</span><br><button onclick="mulaiUjian('${x.mapel}','${x.kelas}')">MULAI UJIAN</button></div>`;
  });
  document.getElementById("app").innerHTML=h;
}

// === 4. MULAI UJIAN - 5 JENIS SOAL ===
function mulaiUjian(mapel, kelasJadwal){
  mapelAktif=mapel;
  // Filter soal: mapel sama + kelas cocok
  let list = soalDB.filter(s=> s.mapel==mapel && kelasCocok(s.kelas));
  if(list.length==0) return alert("Belum ada soal untuk "+mapel+" "+kelasJadwal);
  jawaban={};
  // Acak soal (biar tidak sama urutannya)
  list = list.sort(()=>Math.random()-0.5);
  window.listSoal=list;
  renderSoal(0);
}
function renderSoal(idx){
  let list=window.listSoal; let s=list[idx];
  let labelJenis = {pg:"Pilihan Ganda", pg_kompleks:"Pilihan Ganda Kompleks (Pilih lebih dari 1)", benar_salah:"Benar - Salah", menjodohkan:"Menjodohkan", essay:"Essay"}[s.jenis]||s.jenis;
  let body="";
  // --- PG BIASA ---
  if(s.jenis=="pg"){
    ["A","B","C","D"].forEach(h=>{
      let val = s["opt"+h]||s[h]||"";
      let act = jawaban[idx]==h?"active":"";
      body+=`<div class="opt ${act}" onclick="pilihPG(${idx},'${h}',this)"><b>${h}.</b><div>${renderTeks(val)}</div></div>`;
    });
  }
  // --- PG KOMPLEKS (CHECKBOX) ---
  if(s.jenis=="pg_kompleks"){
    body+=`<p class="small">Centang jawaban yang benar, bisa lebih dari satu.</p>`;
    ["A","B","C","D"].forEach(h=>{
      let val = s["opt"+h]||s[h]||"";
      let arr = jawaban[idx]||[]; let act = arr.includes(h)?"active":"";
      body+=`<label class="checkrow ${act}"><input type="checkbox" ${act?"checked":""} onchange="pilihKompleks(${idx},'${h}',this)"> <b>${h}.</b> <span>${renderTeks(val)}</span></label>`;
    });
  }
  // --- BENAR SALAH ---
  if(s.jenis=="benar_salah"){
    body+=`<p class="small">Pilih Benar / Salah untuk tiap pernyataan di soal.</p>
    <div class="checkrow"><b>Pernyataan 1:</b> <select onchange="pilihBS(${idx},0,this.value)"><option value="">Pilih</option><option ${jawaban[idx]&&jawaban[idx][0]=="B"?"selected":""}>B</option><option ${jawaban[idx]&&jawaban[idx][0]=="S"?"selected":""}>S</option></select></div>
    <div class="checkrow"><b>Pernyataan 2:</b> <select onchange="pilihBS(${idx},1,this.value)"><option value="">Pilih</option><option ${jawaban[idx]&&jawaban[idx][1]=="B"?"selected":""}>B</option><option ${jawaban[idx]&&jawaban[idx][1]=="S"?"selected":""}>S</option></select></div>
    <p class="small">B = Benar, S = Salah. Kunci di Sheets contoh: B,S</p>`;
  }
  // --- MENJODOHKAN ---
  if(s.jenis=="menjodohkan"){
    body+=`<p class="small">Pilih pasangan yang tepat dari dropdown.</p>
    <div class="checkrow"><b>1.</b> <select onchange="pilihJodoh(${idx},0,this.value)"><option value="">Pilih Pasangan</option><option value="A" ${jawaban[idx]&&jawaban[idx][0]=="A"?"selected":""}>A</option><option value="B" ${jawaban[idx]&&jawaban[idx][1]=="B"?"selected":""}>B</option><option value="C" ${jawaban[idx]&&jawaban[idx][2]=="C"?"selected":""}>C</option><option value="D" ${jawaban[idx]&&jawaban[idx][3]=="D"?"selected":""}>D</option></select></div>
    <div class="checkrow"><b>2.</b> <select onchange="pilihJodoh(${idx},1,this.value)"><option value="">Pilih Pasangan</option><option value="A" ${jawaban[idx]&&jawaban[idx][0]=="A"?"selected":""}>A</option><option value="B" ${jawaban[idx]&&jawaban[idx][1]=="B"?"selected":""}>B</option><option value="C" ${jawaban[idx]&&jawaban[idx][2]=="C"?"selected":""}>C</option><option value="D" ${jawaban[idx]&&jawaban[idx][3]=="D"?"selected":""}>D</option></select></div>`;
    // Tampilkan pilihan A-D sebagai daftar pasangan
    ["A","B","C","D"].forEach(h=>{
      let val = s["opt"+h]||s[h]||"";
      body+=`<div class="small"><b>${h}.</b> ${renderTeks(val)}</div>`;
    });
  }
  // --- ESSAY ---
  if(s.jenis=="essay"){
    body+=`<textarea rows="4" placeholder="Tulis jawabanmu..." oninput="jawaban[${idx}]=this.value">${jawaban[idx]||""}</textarea>`;
  }

  let nav = "";
  if(idx>0) nav+=`<button onclick="renderSoal(${idx-1})" style="background:#666">⬅ SEBELUMNYA</button>`;
  if(idx<list.length-1) nav+=`<button onclick="renderSoal(${idx+1})">SELANJUTNYA ➡</button>`;
  else nav+=`<button onclick="kumpul()" style="background:#188038">KUMPULKAN JAWABAN</button>`;

  document.getElementById("app").innerHTML = `
  <div class="card"><span class="badge">${s.jenis} • ${s.bab||""}</span> <span class="small">Soal ${idx+1} / ${list.length}</span>
  <h3>${renderTeks(s.pertanyaan)}</h3>${body}</div>
  <div class="card">${nav}<p class="small">Jawaban tersimpan otomatis. Jangan refresh saat ujian.</p></div>`;
  window.scrollTo(0,0);
}
function pilihPG(i,h,el){ jawaban[i]=h; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("active")); el.classList.add("active"); }
function pilihKompleks(i,h,el){
  if(!jawaban[i]) jawaban[i]=[];
  if(el.checked){ if(!jawaban[i].includes(h)) jawaban[i].push(h); } else { jawaban[i]=jawaban[i].filter(x=>x!=h); }
}
function pilihBS(i,pos,val){ if(!jawaban[i]) jawaban[i]=[]; jawaban[i][pos]=val; }
function pilihJodoh(i,pos,val){ if(!jawaban[i]) jawaban[i]=[]; jawaban[i][pos]=val; }

// === 5. NILAI OTOMATIS + KIRIM DENGAN RETRY (UNTUK 150 SISWA) ===
function hitungNilai(){
  let list=window.listSoal; let benar=0, total=0, detail=[];
  list.forEach((s,idx)=>{
    let bobot = parseFloat(s.bobot||10); total+=bobot;
    let j = jawaban[idx]; let isBenar=false;
    if(s.jenis=="pg"){
      if(j && j==s.kunci) isBenar=true;
    }
    if(s.jenis=="pg_kompleks"){
      // Kunci contoh "A,C" -> harus sama persis
      let kunci = (s.kunci||"").split(",").map(x=>x.trim()).sort().join(",");
      let jawab = (j||[]).slice().sort().join(",");
      if(kunci && kunci==jawab) isBenar=true;
    }
    if(s.jenis=="benar_salah" || s.jenis=="menjodohkan"){
      let kunci = (s.kunci||"").split(",").map(x=>x.trim()).join(",");
      let jawab = (j||[]).join(",");
      if(kunci && kunci==jawab) isBenar=true;
    }
    if(s.jenis=="essay"){ isBenar=false; } // Essay dinilai manual guru
    if(isBenar) benar+=bobot;
    detail.push({no:idx+1, jenis:s.jenis, jawaban: Array.isArray(j)?j.join(","): (j||""), kunci:s.kunci||"", benar:isBenar});
  });
  return {nilai: Math.round(benar/total*100), benar, total, detail};
}
async function kumpul(){
  if(!confirm("Kumpulkan jawaban?")) return;
  let h = hitungNilai();
  document.getElementById("app").innerHTML=`<div class="card"><h3>Mengirim jawaban...</h3><p>Jangan tutup halaman ini.</p></div>`;
  // Retry 3x biar tidak gagal saat 150 siswa bareng
  for(let coba=1;coba<=3;coba++){
    try{
      let r=await fetch(API_URL, {method:"POST", body: JSON.stringify({action:"simpanNilai", nama:siswa.nama, kelas:siswa.kelas, mapel:mapelAktif, nilai:h.nilai, detail:JSON.stringify(h.detail)})});
      let d=await r.json();
      if(d.success) break;
    }catch(e){ if(coba==3) {} else await new Promise(res=>setTimeout(res,1500)); }
  }
  document.getElementById("app").innerHTML=`<div class="card"><h2>✅ Ujian Selesai</h2><p>Nama: ${siswa.nama}</p><p>Kelas: ${siswa.kelas}</p><p>Mapel: ${mapelAktif}</p><h1>Nilai PG: ${h.nilai}</h1><p class="small">Soal Essay akan dinilai manual oleh guru. Jika nilai 0 tapi kamu sudah jawab, hubungi guru, datamu sudah terkirim.</p><button onclick="showLogin()">KEMBALI KE LOGIN</button></div>`;
}
showLogin();
</script></body></html>
