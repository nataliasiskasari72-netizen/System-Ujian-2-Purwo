<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ujian SMP NEGERI 2 PURWO</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#eef2f7;margin:0;padding:0;color:#1e293b}
.top{background:linear-gradient(135deg,#0f4c81 0%,#1a73e8 60%,#0ea5e9 100%);color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px;text-align:center;box-shadow:0 10px 30px rgba(15,76,129,.25)}
.top h1{margin:4px 0;font-size:22px;letter-spacing:.3px}.top p{margin:0;opacity:.9;font-size:13px}
.wrap{max-width:520px;margin:-14px auto 0;padding:0 14px 30px}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.07);border:1px solid #eef2f7}
.card h3{margin:0 0 10px;font-size:16px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #e2e8f0;margin:7px 0;font-size:15px;background:#f8fafc;outline:none}
input:focus,select:focus,textarea:focus{border-color:#1a73e8;background:#fff}
button{width:100%;padding:14px;border-radius:12px;border:none;margin:7px 0;font-size:15px;font-weight:800;cursor:pointer;transition:.2s}
.btn-blue{background:linear-gradient(135deg,#1a73e8,#0ea5e9);color:#fff;box-shadow:0 6px 14px rgba(26,115,232,.3)}
.btn-green{background:#188038;color:#fff}.btn-orange{background:#f59e0b;color:#fff}.btn-gray{background:#f1f5f9;color:#475569}
button:active{transform:scale(.98)}
.badge{display:inline-block;background:#e0f2fe;color:#0369a1;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
.badge-green{background:#dcfce7;color:#166534}
.small{font-size:13px;color:#64748b;line-height:1.5}
.opt{border:1.5px solid #e2e8f0;border-radius:14px;padding:13px;margin:8px 0;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.opt.active{border-color:#1a73e8;background:#eff6ff;box-shadow:0 4px 12px rgba(26,115,232,.12)}
.opt b{width:28px;height:28px;min-width:28px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.active b{background:#1a73e8;color:#fff}
.opt img{max-width:100%;border-radius:10px;margin-top:6px}
.q-img{max-width:100%;border-radius:14px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.checkrow{display:flex;gap:10px;align-items:center;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin:7px 0;background:#fff}
.checkrow.active{border-color:#1a73e8;background:#eff6ff}
.flex2{display:flex;gap:10px}.flex2 button{flex:1}
.jadwal-card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06);border-left:5px solid #1a73e8}
.stat{display:flex;gap:10px}.stat div{flex:1;background:#f8fafc;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:#64748b}
.nilai-row{border-bottom:1px dashed #e2e8f0;padding:10px 0;font-size:14px}
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:8px 0}.progress div{height:100%;background:linear-gradient(90deg,#1a73e8,#0ea5e9);transition:.3s}
</style></head>
<body>
<div class="top"><p>🏫 SMP NEGERI 2 PURWO</p><h1>Ujian Online</h1><p>Belajar • Ujian • Nilai Langsung</p></div>
<div class="wrap"><div id="app"></div></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxESxZqnlDl9oODifmmgZPy87DRFrA4QTR49rYSvR7AxV521ZuWUKfOMEXegMrJhmtqKQ/exec";
let siswa={}, soalDB=[], jadwalDB=[], jawaban={}, mapelAktif="", kelasAktif="", guruNama="Guru";
// ===== 2 LEVEL AKSES =====
let params = new URLSearchParams(window.location.search);
let isAdminMode = params.has("admin");
let isGuruMode = params.has("guru") || isAdminMode;
function renderTeks(t){
  if(!t) return "";
  t = String(t).replace(/\[GAMBAR:\s*([^\]]+)\]/g, (m,id)=>{
    id=id.trim(); let src = id.startsWith("http") ? id : "https://drive.google.com/uc?export=view&id="+id;
    return '<br><img class="q-img" src="'+src+'" onerror="this.style.display=\'none\'">';
  });
  return t;
}
// ===== LOGIN SISWA SAJA =====
function showLogin(){
  document.getElementById("app").innerHTML = `
  <div class="card" style="text-align:center"><div style="font-size:42px">🎓</div><h3>Selamat Datang, Siswa!</h3><p class="small">Masukkan nama lengkap dan kelas untuk melihat jadwal ujian.</p>
  <input id="nama" placeholder="Nama Lengkap - Contoh: Budi Santoso">
  <select id="kelas"><option value="">Pilih Kelas</option><option>7A</option><option>7B</option><option>8A</option><option>8B</option><option>9A</option><option>9B</option></select>
  <button class="btn-blue" onclick="masuk()">MASUK & LIHAT JADWAL ➜</button>
  <p class="small">Pastikan nama sesuai absen. Nilai akan masuk ke rekap guru.</p></div>
  <div class="card"><h3>ℹ️ Cara Ujian</h3><p class="small">1. Masuk pakai nama & kelas<br>2. Pilih jadwal ujian<br>3. Jawab semua soal, lalu kumpulkan<br>4. Nilai PG langsung keluar</p></div>`;
}
function showLoginGuru(){
  let judul = isAdminMode ? "Login Admin" : "Login Guru";
  let ket = isAdminMode ? "Halaman khusus Admin. Jangan dibagikan." : "Halaman khusus Guru. Jangan dibagikan ke siswa.";
  let tombolGanti = isAdminMode ? `<p class="small" style="text-align:center"><span onclick="gantiPassword()" style="color:#f59e0b;text-decoration:underline;cursor:pointer;font-weight:700">🔑 Ganti Password Admin •</span><br><span onclick="resetPasswordAdmin()" style="color:#dc2626;text-decoration:underline;cursor:pointer">Lupa Password? Klik untuk Reset ke 12345</span></p>` : `<p class="small" style="text-align:center">Ganti password hanya bisa oleh Admin.<br><span onclick="resetPasswordAdmin()" style="color:#dc2626;text-decoration:underline;cursor:pointer">Lupa Password? Klik untuk Reset ke 12345</span></p>`;
  document.getElementById("app").innerHTML = `
  <div class="card"><div style="font-size:36px;text-align:center">${isAdminMode ? "🛡️" : "👩‍🏫"}</div><h3 style="text-align:center">${judul}</h3>
  <p class="small" style="text-align:center">${ket}</p>
  <input id="guruNama" placeholder="Nama ${isAdminMode ? "Admin" : "Guru"}">
  <input id="guruPass" type="password" placeholder="Password">
  <button class="btn-green" onclick="masukGuru()">MASUK SEBAGAI ${isAdminMode ? "ADMIN" : "GURU"}</button>
  <button class="btn-gray" onclick="window.location.href=window.location.pathname">← Kembali ke Login Siswa</button>
  ${tombolGanti}</div>`;
}
function masuk(){
  let n=document.getElementById("nama").value.trim();
  let k=document.getElementById("kelas").value;
  if(!n||!k) return alert("Isi nama dan kelas dulu ya!");
  siswa={nama:n,kelas:k}; kelasAktif=k; loadData();
}
function masukGuru(){
  let p=document.getElementById("guruPass").value;
  let n=document.getElementById("guruNama").value.trim()||"Guru";
  let passTersimpan = localStorage.getItem("passGuru") || "12345";
  if(p!=passTersimpan) return alert("Password salah!");
  guruNama=n; showGuruPortal();
}
// ===== GANTI PASSWORD - HANYA ADMIN =====
function gantiPassword(){
  if(!isAdminMode) return alert("Hanya Admin yang bisa ganti password! Buka lewat link ?admin");
  let lama = prompt("Masukkan Password Lama:");
  if(!lama) return;
  let passTersimpan = localStorage.getItem("passGuru") || "12345";
  if(lama != passTersimpan) return alert("Password lama salah!");
  let baru = prompt("Masukkan Password Baru (min 4 karakter):");
  if(!baru || baru.length < 4) return alert("Password baru minimal 4 karakter!");
  let konfirm = prompt("Ulangi Password Baru:");
  if(baru != konfirm) return alert("Password baru tidak sama!");
  localStorage.setItem("passGuru", baru);
  alert("Password berhasil diganti! Mulai sekarang login guru & admin pakai password baru ini.");
}

function resetPasswordAdmin(){
  if(!confirm("Reset password ke 12345?")) return;
  localStorage.removeItem("passGuru");
  alert("Password berhasil direset ke 12345! Silakan login lagi pakai 12345.");
  window.location.reload();
}
  
async function loadData(){
  document.getElementById("app").innerHTML="<div class='card' style='text-align:center'>⏳ Memuat soal...</div>";
  try{
    let r=await fetch(API_URL+"?action=getData"); let d=await r.json();
    if(d.error) return document.getElementById("app").innerHTML="<div class='card'>Error: "+d.error+"<br><button class='btn-gray' onclick='showLogin()'>Kembali</button></div>";
    soalDB=d.soal||[]; jadwalDB=d.jadwal||[]; showJadwal();
  }catch(e){ document.getElementById("app").innerHTML="<div class='card'>Gagal load. Cek API_URL / Deploy Apps Script.<br><button class='btn-gray' onclick='showLogin()'>Coba Lagi</button></div>"; }
}
function kelasCocok(kelasSoal){
  if(!kelasSoal) return false;
  kelasSoal=String(kelasSoal).trim().toUpperCase();
  if(kelasSoal=="SEMUA") return true;
  if(kelasSoal==kelasAktif) return true;
  if(kelasSoal=="KELAS 7" && (kelasAktif=="7A"||kelasAktif=="7B")) return true;
  if(kelasSoal=="KELAS 8" && (kelasAktif=="8A"||kelasAktif=="8B")) return true;
  if(kelasSoal=="KELAS 9" && (kelasAktif=="9A"||kelasAktif=="9B")) return true;
  return false;
}
function showJadwal(){
  let j = jadwalDB.filter(x=>kelasCocok(x.kelas));
  let h=`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:#e0f2fe;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px">👋</div><div><b style="font-size:16px">Halo, ${siswa.nama}</b><br><span class="small">Kelas ${siswa.kelas} • ${j.length} ujian tersedia</span></div></div></div>`;
  if(j.length==0) h+=`<div class="card" style="text-align:center"><div style="font-size:36px">📭</div><p>Belum ada jadwal untuk kelas kamu.</p><p class="small">Silakan hubungi guru / cek lagi nanti.</p></div>`;
  j.forEach((x)=>{
    let m = String(x.mapel).replace(/'/g,""); let k = String(x.kelas).replace(/'/g,"");
    h+=`<div class="jadwal-card"><span class="badge">${x.kelas}</span> <span class="badge badge-green">${x.durasi} Menit</span><br><b style="font-size:17px;margin:8px 0;display:block">📚 ${x.mapel}</b><span class="small">📅 ${x.tanggal} &nbsp; 🕐 ${x.jam} &nbsp; ${x.keterangan||""}</span><br><button class="btn-blue" onclick="mulaiUjian('${m}','${k}')">MULAI UJIAN ➜</button></div>`;
  });
  h+=`<div class="card"><button class="btn-gray" onclick="showLogin()">KELUAR</button></div>`;
  document.getElementById("app").innerHTML=h;
}
// ===== ANTI CURANG + BATAS WAKTU =====
let pelanggaran = 0;
let ujianTerkunci = false;
let waktuMulaiUjian = 0, waktuSelesaiUjian = 0, timerInterval = null;
function cekWaktuKirim(){
  let now = new Date(); let sisa = Math.floor((waktuSelesaiUjian - now)/1000);
  let el = document.getElementById("infoWaktuKirim");
  if(!el) return;
  if(now >= waktuSelesaiUjian){
    clearInterval(timerInterval);
    el.innerHTML = `<b style="color:#dc2626">⏰ WAKTU HABIS! Jawaban otomatis dikirim...</b>`;
    setTimeout(()=>{ if(!ujianTerkunci) kumpul(true); }, 1000);
    return;
  }

    if(!waktuSelesaiUjian || isNaN(waktuSelesaiUjian.getTime())){
    let el2 = document.getElementById("infoWaktuKirim");
    if(el2) el2.innerHTML = `⏰ Jadwal tidak terbaca, tombol kirim akan aktif 10 menit terakhir.`;
    return;
  }
  
  let bukaKirim = new Date(waktuSelesaiUjian.getTime() - 10*60*1000); // 10 menit terakhir
  let btn = document.getElementById("btnKumpul");
  if(now < bukaKirim){
    let sisaBuka = Math.floor((bukaKirim - now)/1000);
    let jam = Math.floor(sisaBuka/3600), mnt = Math.floor((sisaBuka%3600)/60), dtk = sisaBuka%60;
    if(btn){ btn.disabled = true; btn.style.opacity = "0.5"; btn.innerHTML = `🔒 TOMBOL KIRIM BUKA ${String(jam).padStart(2,"0")}:${String(mnt).padStart(2,"0")}:${String(dtk).padStart(2,"0")} LAGI`; }
    let totalSisa = Math.floor(sisa/60); let totalJam = Math.floor(totalSisa/60); let totalMnt = totalSisa%60;
    el.innerHTML = `⏰ Sisa ujian: <b>${totalJam} jam ${totalMnt} menit</b> • Tombol KIRIM aktif 10 menit terakhir, yaitu jam <b>${bukaKirim.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</b> - <b>${waktuSelesaiUjian.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</b>`;
  } else {
    if(btn){ btn.disabled = false; btn.style.opacity = "1"; btn.innerHTML = `✅ KUMPULKAN JAWABAN (Sisa ${Math.floor(sisa/60)} menit)`; }
    el.innerHTML = `<b style="color:#16a34a">🟢 TOMBOL KIRIM SUDAH AKTIF! Segera kumpulkan sebelum jam ${waktuSelesaiUjian.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</b>`;
  }
}
function pasangAntiCurang(){
  pelanggaran = 0; ujianTerkunci = false;
  document.removeEventListener("visibilitychange", handlePindah);
  document.addEventListener("visibilitychange", handlePindah);
  window.removeEventListener("blur", handlePindah);
  window.addEventListener("blur", handlePindah);
}
function handlePindah(){
  if(ujianTerkunci || !window.listSoal) return;
  if(document.hidden || document.visibilityState === "hidden"){
    pelanggaran++;
    if(pelanggaran == 1) alert("⚠️ PERINGATAN 1/2\n\nKamu terdeteksi pindah jendela / membuka aplikasi lain!\n\nJangan pindah lagi! Kalau 2x lagi, ujian akan terkunci dan jawaban otomatis dikirim.");
    else if(pelanggaran == 2) alert("⚠️ PERINGATAN 2/2 - TERAKHIR!\n\nIni peringatan terakhir!\n\nKalau kamu pindah lagi, ujian akan TERKUNCI dan jawaban langsung dikirim dengan nilai apa adanya.");
    else if(pelanggaran >= 3){
      ujianTerkunci = true;
      alert("🚨 UJIAN TERKUNCI!\n\nKamu sudah 3x pindah jendela.\nJawaban akan dikirim otomatis sekarang dan kamu tidak bisa mengerjakan lagi.");
      kumpul(true);
    }
  }
}
  
async function mulaiUjian(mapel, kelasJadwal){
  mapelAktif = mapel;
  // CEK SUDAH MENGERJAKAN - dari server
  document.getElementById("app").innerHTML = `<div class="card" style="text-align:center">⏳ Mengecek riwayat ujian...</div>`;
  try{
    let r = await fetch(API_URL+"?action=getData"); let d = await r.json();
    let sudah = (d.nilai||[]).find(v => String(v.nama||"").trim().toLowerCase() == siswa.nama.trim().toLowerCase() && String(v.kelas||"").trim().toUpperCase() == siswa.kelas.trim().toUpperCase() && String(v.mapel||"").trim().toLowerCase() == mapel.trim().toLowerCase());
    if(sudah){
      document.getElementById("app").innerHTML = `<div class="card" style="text-align:center"><div style="font-size:48px">✅</div><h3>Kamu Sudah Mengerjakan!</h3><p>Nama: ${siswa.nama}<br>Kelas: ${siswa.kelas}<br>Mapel: ${mapel}<br>Nilai kamu: <b style="font-size:28px;color:#16a34a">${sudah.nilai}</b></p><p class="small">Ujian hanya bisa dikerjakan 1x. Hubungi guru jika ada kesalahan.</p><button class="btn-blue" onclick="showJadwal()">KEMBALI KE JADWAL</button></div>`;
      return;
    }
    soalDB = d.soal||[]; jadwalDB = d.jadwal||[];
  }catch(e){}
  let list = soalDB.filter(s=> s.mapel==mapel && kelasCocok(s.kelas));
  if(list.length==0) return alert("Belum ada soal untuk "+mapel);
  // HITUNG JAM SELESAI dari Jadwal
  let jadwal = jadwalDB.find(j=> j.mapel==mapel && kelasCocok(j.kelas));
  let now = new Date();
  if(jadwal && jadwal.tanggal && jadwal.jam){
  let tglRaw = String(jadwal.tanggal||"").trim().substring(0,10);
  let jamRaw = String(jadwal.jam||"").trim().substring(0,5);
  // Kalau tanggal masih format Mon Nov 17... -> ubah manual
  if(tglRaw.includes(" " ) || tglRaw.includes("Nov") || tglRaw.includes("Dec")){
    let d = new Date(jadwal.tanggal);
    if(!isNaN(d)) tglRaw = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  // Kalau jam format 07.30 -> ubah ke 07:30
  jamRaw = jamRaw.replace(". ",":").replace(".",":");
  // Kalau jam dari Sheets kebaca 0.3125 (format Excel) -> ubah ke jam
  if(!isNaN(jadwal.jam) && String(jadwal.jam).includes(".")){
    let totalMenit = Math.round(parseFloat(jadwal.jam)*24*60);
    jamRaw = String(Math.floor(totalMenit/60)).padStart(2,"0")+":"+String(totalMenit%60).padStart(2,"0");
  }
  waktuMulaiUjian = new Date(tglRaw+"T"+jamRaw+":00");
  let durasi = parseInt(jadwal.durasi||60);
  if(isNaN(durasi)) durasi = 60;
  waktuSelesaiUjian = new Date(waktuMulaiUjian.getTime() + durasi*60*1000);
  // PENGAMAN: Kalau tanggal masih NaN, pakai 60 menit dari sekarang
  if(isNaN(waktuSelesaiUjian.getTime())){
    waktuMulaiUjian = new Date();
    waktuSelesaiUjian = new Date(Date.now() + 60*60*1000);
  }
} else {
    let durasi = parseInt(jadwal.durasi||60);
    waktuSelesaiUjian = new Date(waktuMulaiUjian.getTime() + durasi*60*1000);
  } else {
    // Kalau jadwal tidak ketemu, default 60 menit dari sekarang
    waktuMulaiUjian = now; waktuSelesaiUjian = new Date(now.getTime() + 60*60*1000);
  }
  // Kalau ujian belum waktunya / sudah lewat, tetap izinkan tapi kasih info
  jawaban={}; list = list.sort(()=>Math.random()-0.5); window.listSoal=list;
  pasangAntiCurang();
  renderSoal(0);
}
function renderSoal(idx){
  let list=window.listSoal; let s=list[idx];
  let labelJenis = {pg:"Pilihan Ganda", pg_kompleks:"PG Kompleks", benar_salah:"Benar - Salah", menjodohkan:"Menjodohkan", essay:"Essay"}[s.jenis]||s.jenis;
  let persen = Math.round((idx+1)/list.length*100);
  let body="";
  if(s.jenis=="pg"){
    ["A","B","C","D"].forEach(h=>{
      let val = s[h]||""; let act = jawaban[idx]==h?"active":"";
      body+=`<div class="opt ${act}" onclick="pilihPG(${idx},'${h}',this)"><b>${h}</b><div>${renderTeks(val)}</div></div>`;
    });
  }
  if(s.jenis=="pg_kompleks"){
    body+=`<p class="small">Centang jawaban yang benar, bisa lebih dari satu.</p>`;
    ["A","B","C","D"].forEach(h=>{
      let val = s[h]||""; let arr = jawaban[idx]||[]; let act = arr.includes(h)?"active":"";
      body+=`<label class="checkrow ${act}"><input type="checkbox" ${act?"checked":""} onchange="pilihKompleks(${idx},'${h}',this)"> <b>${h}.</b> <span>${renderTeks(val)}</span></label>`;
    });
  }
  if(s.jenis=="benar_salah"){
    body+=`<p class="small">Pilih Benar / Salah untuk tiap pernyataan.</p>
    <div class="checkrow"><b>1.</b> <select onchange="pilihBS(${idx},0,this.value)" style="margin:0"><option value="">Pilih</option><option value="B" ${jawaban[idx]&&jawaban[idx][0]=="B"?"selected":""}>B - Benar</option><option value="S" ${jawaban[idx]&&jawaban[idx][0]=="S"?"selected":""}>S - Salah</option></select></div>
    <div class="checkrow"><b>2.</b> <select onchange="pilihBS(${idx},1,this.value)" style="margin:0"><option value="">Pilih</option><option value="B" ${jawaban[idx]&&jawaban[idx][1]=="B"?"selected":""}>B - Benar</option><option value="S" ${jawaban[idx]&&jawaban[idx][1]=="S"?"selected":""}>S - Salah</option></select></div>`;
  }
  if(s.jenis=="menjodohkan"){
    body+=`<p class="small">Pilih pasangan yang tepat.</p>
    <div class="checkrow"><b>1.</b> <select onchange="pilihJodoh(${idx},0,this.value)" style="margin:0"><option value="">Pilih</option><option value="A" ${jawaban[idx]&&jawaban[idx][0]=="A"?"selected":""}>A</option><option value="B" ${jawaban[idx]&&jawaban[idx][0]=="B"?"selected":""}>B</option><option value="C" ${jawaban[idx]&&jawaban[idx][0]=="C"?"selected":""}>C</option><option value="D" ${jawaban[idx]&&jawaban[idx][0]=="D"?"selected":""}>D</option></select></div>
    <div class="checkrow"><b>2.</b> <select onchange="pilihJodoh(${idx},1,this.value)" style="margin:0"><option value="">Pilih</option><option value="A" ${jawaban[idx]&&jawaban[idx][1]=="A"?"selected":""}>A</option><option value="B" ${jawaban[idx]&&jawaban[idx][1]=="B"?"selected":""}>B</option><option value="C" ${jawaban[idx]&&jawaban[idx][1]=="C"?"selected":""}>C</option><option value="D" ${jawaban[idx]&&jawaban[idx][1]=="D"?"selected":""}>D</option></select></div>`;
    ["A","B","C","D"].forEach(h=>{ body+=`<div class="small"><b>${h}.</b> ${renderTeks(s[h]||"")}</div>`; });
  }
  if(s.jenis=="essay"){ body+=`<textarea rows="4" placeholder="Tulis jawabanmu di sini..." oninput="jawaban[${idx}]=this.value">${jawaban[idx]||""}</textarea>`; }
  let nav = "";
  if(idx>0) nav+=`<button class="btn-gray" onclick="renderSoal(${idx-1})">⬅ SEBELUMNYA</button>`;
  if(idx<list.length-1) nav+=`<button class="btn-blue" onclick="renderSoal(${idx+1})">SELANJUTNYA ➜</button>`;
else nav+=`<button id="btnKumpul" class="btn-green" onclick="kumpul()">✅ KUMPULKAN JAWABAN</button>`;
  document.getElementById("app").innerHTML = `
  <div class="card"><div id="infoWaktuKirim" class="small" style="text-align:center;background:#fefce8;padding:10px;border-radius:10px;margin-bottom:8px">⏰ Memuat jadwal kirim...</div>${nav}<p class="small" style="text-align:center">Jawaban tersimpan otomatis. Jangan pindah jendela / buka aplikasi lain. Pelanggaran ${pelanggaran}/2.</p></div>`;
    if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(cekWaktuKirim, 1000);
  cekWaktuKirim();
  window.scrollTo(0,0);
}
function pilihPG(i,h,el){ jawaban[i]=h; document.querySelectorAll(".opt").forEach(o=>o.classList.remove("active")); el.classList.add("active"); }
function pilihKompleks(i,h,el){ if(!jawaban[i]) jawaban[i]=[]; if(el.checked){ if(!jawaban[i].includes(h)) jawaban[i].push(h); } else { jawaban[i]=jawaban[i].filter(x=>x!=h); } }
function pilihBS(i,pos,val){ if(!jawaban[i]) jawaban[i]=[]; jawaban[i][pos]=val; }
function pilihJodoh(i,pos,val){ if(!jawaban[i]) jawaban[i]=[]; jawaban[i][pos]=val; }
function hitungNilai(){
  let list=window.listSoal; let benar=0, total=0, detail=[];
  list.forEach((s,idx)=>{
    let bobot = parseFloat(s.bobot||10); total+=bobot; let j = jawaban[idx]; let isBenar=false;
    if(s.jenis=="pg"){ if(j && String(j).trim().toUpperCase()==String(s.kunci||"").trim().toUpperCase()) isBenar=true; }
    if(s.jenis=="pg_kompleks"){ let kunci = String(s.kunci||"").split(",").map(x=>x.trim().toUpperCase()).sort().join(","); let jawab = (j||[]).slice().sort().join(","); if(kunci && kunci==jawab) isBenar=true; }
    if(s.jenis=="benar_salah" || s.jenis=="menjodohkan"){ let kunci = String(s.kunci||"").split(",").map(x=>x.trim().toUpperCase()).join(","); let jawab = (j||[]).join(","); if(kunci && kunci==jawab) isBenar=true; }
    if(isBenar) benar+=bobot; detail.push({no:idx+1, jenis:s.jenis, jawaban: Array.isArray(j)?j.join(","): (j||""), kunci:s.kunci||"", benar:isBenar});
  });
  return {nilai: total>0?Math.round(benar/total*100):0, benar, total, detail};
}
async function kumpul(otomatis=false){
  if(!otomatis && !confirm("Kumpulkan jawaban?")) return;
  if(ujianTerkunci && !otomatis && pelanggaran>=3) return alert("Ujian sudah terkunci!");
  if(!otomatis){
    let now = new Date();
    let bukaKirim = new Date(waktuSelesaiUjian.getTime() - 10*60*1000);
    if(now < bukaKirim) return alert("Tombol kirim belum aktif!\\n\\nTombol kirim hanya aktif 10 menit terakhir, yaitu jam "+bukaKirim.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+" - "+waktuSelesaiUjian.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+".\\n\\nSilakan periksa lagi jawabanmu sambil menunggu.");
  }
  if(timerInterval) clearInterval(timerInterval);
  document.removeEventListener("visibilitychange", handlePindah);
  window.removeEventListener("blur", handlePindah);
  if(!confirm("Kumpulkan jawaban?")) return;
  let h = hitungNilai();
  document.getElementById("app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:36px">⏳</div><h3>Mengirim jawaban...</h3><p class="small">Jangan tutup halaman ini.</p></div>`;
  for(let coba=1;coba<=3;coba++){
    try{ let r=await fetch(API_URL, {method:"POST", body: JSON.stringify({action:"simpanNilai", nama:siswa.nama, kelas:siswa.kelas, mapel:mapelAktif, nilai:h.nilai, detail:JSON.stringify(h.detail)})}); let d=await r.json(); if(d.success) break; if(coba==3) alert("Gagal simpan: "+(d.msg||"")); }catch(e){ if(coba==3) alert("Gagal simpan. Hubungi guru. Error: "+e.message); else await new Promise(res=>setTimeout(res,1500)); }
  }
  document.getElementById("app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h2>Ujian Selesai!</h2><p>Nama: ${siswa.nama} • Kelas: ${siswa.kelas}<br>Mapel: ${mapelAktif}</p><div style="background:#dcfce7;border-radius:16px;padding:16px;margin:12px 0"><span class="small">Nilai Pilihan Ganda</span><h1 style="margin:4px 0;font-size:44px;color:#166534">${h.nilai}</h1><span class="small">Soal Essay dinilai manual oleh guru</span></div><button class="btn-blue" onclick="showLogin()">KEMBALI KE BERANDA</button></div>`;
}
// ===== PORTAL GURU / ADMIN =====

  let c8 = soalDB.filter(s=>String(s.kelas).toUpperCase()=="KELAS 8").length;
  let c9 = soalDB.filter(s=>String(s.kelas).toUpperCase()=="KELAS 9").length;

  else { nilaiDB.slice(-20).reverse().forEach(v=>{ htmlNilai += `<div class="nilai-row"><b>${v.nama}</b> - ${v.kelas} - ${v.mapel}<br><span class="small">Benar: ${v.benar} | Salah: ${v.salah} | <b>Nilai: ${v.nilai}</b> | ${v.waktu}</span></div>`; }); }
  let htmlJadwal = "";
  if(jadwalDB.length==0) htmlJadwal = `<p class="small">Belum ada jadwal.</p>`;
  jadwalDB.forEach((j,i)=>{ htmlJadwal += `<div style="border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin:8px 0"><b>📚 ${j.mapel}</b> - ${j.kelas}<br><span class="small">${j.tanggal} | ${j.jam} | ${j.durasi} menit | ${j.keterangan||""}</span></div>`; });
  let zonaAdmin = isAdminMode ? `<div class="card" style="background:#fef2f2;border:1px solid #fecaca;margin:0"><h3 style="color:#b91c1c">🛡️ Zona Admin</h3><p class="small">Hati-hati! Tombol ini hanya untuk Admin.</p><button style="background:#dc2626;color:#fff" onclick="hapusSemuaNilai()">🗑️ HAPUS SEMUA NILAI</button><button style="background:#fff;color:#dc2626;border:1px solid #fecaca" onclick="hapusNilaiFilter()">🗑️ HAPUS NILAI YANG DIFILTER SAJA</button><p class="small">Hapus Semua = hapus semua mapel & kelas.<br>Hapus Filter = hapus sesuai pilihan Mapel / Kelas di atas.</p></div>` : ``;
  document.getElementById("app").innerHTML = `
  <div class="card"><div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;background:${isAdminMode?"#fee2e2":"#dcfce7"};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px">${isAdminMode?"🛡️":"👩‍🏫"}</div><div><b style="font-size:17px">Halo, ${guruNama} ${isAdminMode?"(Admin)":"(Guru)"}</b><br><span class="small">Portal ${isAdminMode?"Admin":"Guru"} • SMP NEGERI 2 PURWO</span></div></div>
  <div class="flex2"><button class="btn-gray" onclick="window.location.href=window.location.pathname">KELUAR</button></div></div>
  ${zonaAdmin}
  <div class="card"><h3>📊 Rekap Nilai</h3><div class="stat"><div><b>${totalSiswa}</b><span>Sudah Ujian</span></div><div><b>${rata}</b><span>Rata-rata</span></div><div><b>${lulus}</b><span>Lulus ≥70</span></div></div>
  <div style="display:flex;gap:8px"><select id="filterMapel"><option value="">Semua Mapel</option><option>Matematika</option><option>IPA</option><option>Bahasa Indonesia</option><option>IPS</option><option>Bahasa Inggris</option><option>PPKn</option></select><select id="filterKelas"><option value="">Semua Kelas</option><option>7A</option><option>7B</option><option>8A</option><option>8B</option><option>9A</option><option>9B</option></select></div>
  <button class="btn-green" onclick="filterNilai()">🔍 TAMPILKAN / FILTER</button>
  <button class="btn-blue" onclick="downloadExcel()">⬇ DOWNLOAD REKAP EXCEL (.CSV)</button>
  <button class="btn-orange" onclick="copyRekap()">📋 COPY UNTUK WA</button>
  <div id="hasilFilter"></div><div id="listNilai"><h4>20 Nilai Terakhir:</h4>${htmlNilai}</div></div>
  <div class="card"><h3>📅 Tambah Jadwal Baru</h3>
  <select id="jMapel"><option>Matematika</option><option>IPA</option><option>Bahasa Indonesia</option><option>IPS</option><option>Bahasa Inggris</option><option>PPKn</option></select>
  <select id="jKelas"><option value="KELAS 7">KHUSUS KELAS 7 (7A+7B)</option><option value="KELAS 8">KHUSUS KELAS 8 (8A+8B)</option><option value="KELAS 9">KHUSUS KELAS 9 (9A+9B)</option><option value="SEMUA">SEMUA KELAS 7A-9B</option></select>
  <input type="date" id="jTanggal" value="2026-11-17"><input type="time" id="jJam" value="07:30"><input type="number" id="jDurasi" value="60" placeholder="Durasi (menit)"><input id="jKet" placeholder="Keterangan">
  <button class="btn-blue" onclick="tambahJadwal()">+ TAMBAH JADWAL</button></div>

  <input id="sA" placeholder="Pilihan A - Bisa [GAMBAR:ID]"><input id="sB" placeholder="Pilihan B"><input id="sC" placeholder="Pilihan C"><input id="sD" placeholder="Pilihan D"><input id="sKunci" placeholder="Kunci - Contoh: B atau A,C atau B,S">
  <button class="btn-green" onclick="tambahSoal()">+ TAMBAH SOAL</button></div>`;

function getFilteredNilai(){ let m = document.getElementById("filterMapel")?.value || ""; let k = document.getElementById("filterKelas")?.value || ""; return (window.nilaiDB||[]).filter(x=>{ if(m && x.mapel!=m) return false; if(k && x.kelas!=k) return false; return true; }); }
function filterNilai(){ let data = getFilteredNilai(); let h = `<h4>Hasil Filter: ${data.length} siswa</h4>`; if(data.length==0) h += `<p class="small">Tidak ada data untuk filter ini.</p>`; data.slice(-50).reverse().forEach(v=>{ h += `<div class="nilai-row"><b>${v.nama}</b> - ${v.kelas} - ${v.mapel} | Benar:${v.benar} Salah:${v.salah} | <b>Nilai:${v.nilai}</b> | ${v.waktu}</div>`; }); document.getElementById("hasilFilter").innerHTML = h; }
function downloadExcel(){ let data = getFilteredNilai(); if(data.length==0 && (window.nilaiDB||[]).length>0) data = window.nilaiDB; if(data.length==0) return alert("Tidak ada data nilai! Klik TAMPILKAN / FILTER dulu."); let csv = "Nama;Kelas;Mapel;Benar;Salah;Nilai;Waktu\n"; data.forEach(v=>{ let nama = String(v.nama||"").replace(/;/g," "); let waktu = String(v.waktu||"").replace(/;/g," "); csv += nama + ";" + v.kelas + ";" + v.mapel + ";" + v.benar + ";" + v.salah + ";" + v.nilai + ";" + waktu + "\n"; }); let blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"}); let url = URL.createObjectURL(blob); let link = document.createElement("a"); link.href = url; let fMapel = document.getElementById("filterMapel")?.value || "SemuaMapel"; let fKelas = document.getElementById("filterKelas")?.value || "SemuaKelas"; link.download = "Rekap_Nilai_"+fMapel+"_"+fKelas+".csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url); alert("Berhasil! File .csv ter-download ("+data.length+" siswa)."); }
function copyRekap(){ let data = getFilteredNilai(); if(data.length==0) return alert("Tidak ada data."); let txt = "REKAP NILAI - "+(document.getElementById("filterMapel")?.value||"Semua Mapel")+" - "+(document.getElementById("filterKelas")?.value||"Semua Kelas")+"\n"; txt += "Nama | Kelas | Mapel | Benar | Salah | Nilai\n"; data.forEach(v=>{ txt += `${v.nama} | ${v.kelas} | ${v.mapel} | ${v.benar} | ${v.salah} | ${v.nilai}\n`; }); navigator.clipboard.writeText(txt).then(()=>alert("Rekap berhasil di-copy!")); }

async function hapusSemuaNilai(){
  if(!isAdminMode) return alert("Hanya Admin yang bisa hapus nilai! Buka lewat ?admin");
  let ketik = prompt("KETIK: HAPUS untuk menghapus SEMUA nilai ("+(window.nilaiDB||[]).length+" siswa):");
  if(ketik != "HAPUS") return alert("Dibatalkan. Kamu harus ketik HAPUS persis.");
  if(!confirm("YAKIN hapus semua nilai? Tidak bisa dikembalikan!")) return;
  try{ let r = await fetch(API_URL, {method:"POST", body: JSON.stringify({action:"hapusNilai", mode:"semua"})}); let d = await r.json(); if(d.success){ alert("Semua nilai berhasil dihapus!"); showGuruPortal(); } else alert("Gagal: "+(d.msg||"")); }catch(e){ alert("Gagal hapus. Pastikan Apps Script sudah di-Deploy ulang. Error: "+e.message); }
}
async function hapusNilaiFilter(){

  if(ketik != "HAPUS") return alert("Dibatalkan.");

async function tambahJadwal(){ let data = {action:"addJadwal", mapel:document.getElementById("jMapel").value, kelas:document.getElementById("jKelas").value, tanggal:document.getElementById("jTanggal").value, jam:document.getElementById("jJam").value, durasi:document.getElementById("jDurasi").value, keterangan:document.getElementById("jKet").value}; if(!data.tanggal) return alert("Isi tanggal dulu!"); try{ let r = await fetch(API_URL, {method:"POST", body:JSON.stringify(data)}); let d = await r.json(); if(d.success){ alert("Jadwal berhasil ditambah!"); showGuruPortal(); } else { alert("Gagal: "+(d.msg||"")); } }catch(e){ alert("Gagal simpan. Pastikan Apps Script sudah di-Deploy ulang. Error: "+e.message); } }
